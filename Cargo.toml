[workspace]
resolver = "3"
members = [
    "crates/selu-diagnostics",
    "crates/selu-syntax",
    "crates/selu-manifest",
    "crates/selu-manifest-gen",
    "crates/selu-check",
    "crates/selu-lower",
    "crates/selu-sim",
    "crates/selu-cli",
]
exclude = ["placeholder"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
