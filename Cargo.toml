[workspace]
resolver = "3"
members = [
    "crates/selu-gamedata",
    "crates/selu-diagnostics",
    "crates/selu-syntax",
    "crates/selu-manifest",
    "crates/selu-manifest-gen",
    "crates/selu-check",
    "crates/selu-lower",
    "crates/selu-sim",
    "crates/selu-sourcemap",
    "crates/selu-fmt",
    "crates/selu-test",
    "crates/selu-debug",
    "crates/selu-cli",
]
exclude = ["placeholder"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# The test suite runs `selu` hundreds of times; each run parses large manifest
# JSON files. Optimising dependencies and the manifest crate even in dev and
# test builds makes that several times faster, while our own crates keep fast
# incremental compiles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.selu-manifest]
opt-level = 3

# The compiler runs over the full game API in many tests.
[profile.dev.package.selu-check]
opt-level = 2

[profile.dev.package.selu-lower]
opt-level = 2

[profile.dev.package.selu-syntax]
opt-level = 2
