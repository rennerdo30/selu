[package]
name = "selu-sim"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
serde_json.workspace = true
selu-manifest = { path = "../selu-manifest" }
mlua = { version = "0.10", features = ["lua51", "vendored"] }
serde.workspace = true
toml.workspace = true
ab_glyph = "0.2.32"
# Match Studio's existing shaping version; avoid a second shaping dependency tree.
harfrust = "0.12"
# Reuse Studio's bundled fallback face (no GUI/runtime dependency).
epaint_default_fonts = { version = "0.37", default-features = false }

selu-gamedata = { path = "../selu-gamedata" }
